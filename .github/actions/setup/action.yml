name: 'Setup environment'
description: 'Setup Node.js and pnpm, install dependencies and generate build prerequisites'

inputs:
  translations:
    description: 'Translation targets: web, website, all, or false'
    default: web

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Restore generated prerequisites
      id: generated
      uses: actions/cache@v4
      with:
        path: |
          libs/database/generated
          libs/shared/dist
        key: ${{ runner.os }}-${{ runner.arch }}-generated-v1-${{ hashFiles('.github/actions/setup/action.yml', '.nvmrc', '.npmrc', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'libs/database/package.json', 'libs/database/prisma/**', 'libs/database/prisma.config.ts', 'libs/shared/package.json', 'libs/shared/src/**', 'libs/shared/tsconfig.json', 'libs/shared/rollup.config.js') }}

    - name: Generate Prisma client
      if: steps.generated.outputs.cache-hit != 'true'
      run: pnpm database run db:generate
      shell: bash

    - name: Build shared library
      if: steps.generated.outputs.cache-hit != 'true'
      run: pnpm shared build
      shell: bash

    - name: Generate web messages
      if: inputs.translations == 'web' || inputs.translations == 'all'
      run: pnpm web exec paraglide-js compile --project ./project.inlang --outdir ./src/paraglide
      shell: bash

    - name: Generate website messages
      if: inputs.translations == 'website' || inputs.translations == 'all'
      run: pnpm website translate
      shell: bash
