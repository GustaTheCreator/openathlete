name: Tourmalet release

on:
  push:
    tags: ['tourmalet-v*']

permissions:
  contents: read

concurrency:
  group: tourmalet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      api-digest: ${{ steps.candidate.outputs.api-digest }}
      web-digest: ${{ steps.candidate.outputs.web-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch stable branch
        run: git fetch origin tourmalet:refs/remotes/origin/tourmalet
      - name: Validate tag and release ancestry
        run: python scripts/release.py check --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --main-ref origin/tourmalet
      - name: Require successful CI for this exact stable commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          run_id=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow ci.yml \
            --branch tourmalet \
            --event push \
            --commit "$REVISION" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No successful CI push run for $REVISION on tourmalet" >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$REPOSITORY" --name tourmalet-candidate --dir "$RUNNER_TEMP/candidate"
      - id: candidate
        name: Validate tested candidate identity
        run: python scripts/release.py candidate --input "$RUNNER_TEMP/candidate/candidate.json" --revision "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: version
        name: Read release version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Reject existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "A GitHub release already exists for $TAG" >&2
            exit 1
          fi

  promote:
    name: Promote tested images without rebuilding
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/gustathecreator
      VERSION: ${{ needs.validate.outputs.version }}
      REVISION: ${{ github.sha }}
      API_DIGEST: ${{ needs.validate.outputs.api-digest }}
      WEB_DIGEST: ${{ needs.validate.outputs.web-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action@v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag exact tested digests
        run: |
          for component in api web; do
            image="$REGISTRY/openathlete-$component"
            digest="$API_DIGEST"
            if [[ "$component" == web ]]; then digest="$WEB_DIGEST"; fi
            for tag in "$VERSION" "sha-$REVISION"; do
              if existing=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect-error"); then
                if [[ "$existing" != "$digest" ]]; then
                  echo "Refusing to replace existing $component:$tag" >&2
                  exit 1
                fi
              else
                # Network/authentication errors are not evidence that a tag is unused.
                if ! grep -Fq "$image:$tag: not found" "$RUNNER_TEMP/inspect-error" && ! grep -Fq 'manifest unknown' "$RUNNER_TEMP/inspect-error"; then
                  echo "Cannot establish whether $component:$tag already exists" >&2
                  exit 1
                fi
                docker buildx imagetools create --prefer-index=false --tag "$image:$tag" "$image@$digest"
              fi
              actual=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')
              test "$actual" = "$digest"
            done
          done

  smoke:
    name: Smoke test published image digests
    needs: [validate, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ghcr.io/gustathecreator/openathlete-api@${{ needs.validate.outputs.api-digest }}
      WEB_IMAGE: ghcr.io/gustathecreator/openathlete-web@${{ needs.validate.outputs.web-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # pnpm/action-setup@v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter @openathlete/e2e...
      - run: pnpm e2e exec playwright install --with-deps chromium
      - name: Start the release image stack
        run: docker compose -f e2e/docker-compose.yml up -d --no-build --wait
      - name: Smoke test health, login and source identity
        env:
          EXPECTED_SOURCE_URL: https://github.com/GustaTheCreator/openathlete/tree/${{ github.ref_name }}
        run: pnpm e2e test:e2e tests/auth.setup.ts tests/web/release-smoke.spec.ts

      - name: Preserve release diagnostics even after a successful retry
        if: ${{ !cancelled() }}
        run: |
          docker compose -f e2e/docker-compose.yml logs --no-color --timestamps api worker web | python scripts/sanitize_ci_logs.py > e2e/service-logs.txt
          if [[ -f e2e/playwright-results.json ]]; then
            jq '{passed: .stats.expected, flaky: .stats.flaky, failed: .stats.unexpected, retries: ([.. | objects | select(has("retry")) | .retry | select(. > 0)] | length)}' e2e/playwright-results.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/playwright-results.json
            e2e/service-logs.txt
          retention-days: 14

      - name: Stop the release image stack
        if: always()
        run: docker compose -f e2e/docker-compose.yml down -v

  publish-release:
    name: Publish source and release manifest
    needs: [validate, promote, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create source archive
        id: source
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          output=$(python scripts/release.py source --tag "$TAG" --revision "$REVISION" --output-dir "$RUNNER_TEMP/release-assets")
          archive=$(printf '%s\n' "$output" | head -n 1)
          digest=$(printf '%s\n' "$output" | tail -n 1)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          API_DIGEST: ${{ needs.validate.outputs.api-digest }}
          WEB_DIGEST: ${{ needs.validate.outputs.web-digest }}
          SOURCE_SHA256: ${{ steps.source.outputs.sha256 }}
        run: |
          python scripts/release.py manifest \
            --tag "$TAG" \
            --revision "$REVISION" \
            --migration-tree "$(git rev-parse "$REVISION:libs/database/prisma/schema/migrations")" \
            --api-digest "${API_DIGEST#sha256:}" \
            --web-digest "${WEB_DIGEST#sha256:}" \
            --source-sha256 "$SOURCE_SHA256" \
            --output "$RUNNER_TEMP/release-assets/tourmalet-release.json"

      - name: Create draft, upload verified assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes
          gh release upload "$TAG" "$SOURCE_ARCHIVE" "$RUNNER_TEMP/release-assets/tourmalet-release.json"
          gh release edit "$TAG" --draft=false
