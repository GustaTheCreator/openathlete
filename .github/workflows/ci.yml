name: CI

on:
  push:
    branches: [main, tourmalet]
  pull_request:
    branches: [main, tourmalet]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      candidate: ${{ steps.scope.outputs.candidate }}
      website: ${{ steps.scope.outputs.website }}
      docs: ${{ steps.scope.outputs.docs }}
      deploy: ${{ steps.scope.outputs.deploy }}
      timezones: ${{ steps.scope.outputs.timezones }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: python scripts/ci_scope.py

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check:locale-parity
      - run: pnpm --filter '!@openathlete/website' -r --parallel --no-bail --aggregate-output lint

  type-check:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter '!@openathlete/website' -r --parallel --no-bail --aggregate-output tsc:check

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Date bucketing must not depend on the runtime timezone
        tz: ${{ fromJSON(needs.changes.outputs.timezones) }}
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter '!@openathlete/website' -r --no-bail --aggregate-output test

  integration:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # API tests against a real, freshly migrated PostgreSQL database
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: oa
          POSTGRES_PASSWORD: oa
          POSTGRES_DB: oa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oa -d oa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://oa:oa@localhost:5432/oa?schema=public
      INTEGRATION_DATABASE_URL: postgresql://oa:oa@localhost:5432/oa?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          translations: 'false'
      - run: pnpm database run db:deploy
      - run: pnpm api test:integration

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    # apps/docs is a standalone pnpm project with its own lockfile
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: apps/docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check
      - run: pnpm build

  e2e:
    name: End-to-end tests
    needs: [changes, lint, type-check]
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.candidate != 'true'
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml

  candidate:
    name: Tested production candidate
    needs: changes
    if: needs.changes.outputs.app == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/tourmalet' && github.repository == 'GustaTheCreator/openathlete'
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/e2e.yml
    with:
      publish: true

  website:
    name: Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          translations: website
      - uses: actions/cache@v4
        with:
          path: apps/website/.next/cache
          key: ${{ runner.os }}-website-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-website-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm website lint
      - run: pnpm website tsc:check
      - run: pnpm website build

  deploy-tests:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    name: Deployment and release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run deployment tests
        run: python -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Run release helper tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, type-check, test, integration, docs, e2e, candidate, website, deploy-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci_scope.py
