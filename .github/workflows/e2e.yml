name: Production image tests

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

jobs:
  plan:
    name: Select component builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind components to their source inputs
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          python scripts/components.py plan --revision "$GITHUB_SHA" "${args[@]}" --output "$RUNNER_TEMP/component-plan.json"
      - uses: actions/upload-artifact@v7
        with:
          name: component-source-plan
          path: ${{ runner.temp }}/component-plan.json
          retention-days: 30
          if-no-files-found: error

  build:
    name: Prepare ${{ matrix.component }} image
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            repository: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - component: web
            repository: web
            dockerfile: apps/web/Dockerfile
            target: runtime
          - component: migrator
            repository: api
            dockerfile: apps/api/Dockerfile
            target: migrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: component-source-plan
          path: ${{ runner.temp }}
      - id: component
        name: Read component provenance
        run: python scripts/components.py select --plan "$RUNNER_TEMP/component-plan.json" --component '${{ matrix.component }}' --output "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        if: steps.component.outputs.build == 'true'
      - name: Build changed component
        id: image
        if: steps.component.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          outputs: ${{ !inputs.publish && format('type=docker,dest={0}/openathlete-{1}.tar', runner.temp, matrix.component) || '' }}
          tags: ${{ inputs.publish && format('ghcr.io/gustathecreator/openathlete-{0}:candidate-{1}-{2}-{3}-{4}', matrix.repository, matrix.component, github.sha, github.run_id, github.run_attempt) || format('openathlete-{0}:e2e', matrix.component) }}
          labels: |
            org.opencontainers.image.source=https://github.com/GustaTheCreator/openathlete
            org.opencontainers.image.revision=${{ steps.component.outputs.revision }}
            org.opencontainers.image.version=${{ steps.component.outputs.version }}
            org.openathlete.build-inputs=${{ steps.component.outputs.inputs }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Reuse unchanged component
        if: steps.component.outputs.build != 'true'
        env:
          IMAGE: ${{ steps.component.outputs.image }}
          COMPONENT: ${{ matrix.component }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          docker pull "$IMAGE"
          if [[ "$PUBLISH" != true ]]; then
            docker tag "$IMAGE" "openathlete-$COMPONENT:e2e"
            docker save --output "$RUNNER_TEMP/openathlete-$COMPONENT.tar" "openathlete-$COMPONENT:e2e"
          fi
      - name: Record prepared image
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: python scripts/components.py record --plan "$RUNNER_TEMP/component-plan.json" --component "$COMPONENT" --digest "$DIGEST" --output "$RUNNER_TEMP/component-$COMPONENT.json"
      - uses: actions/upload-artifact@v7
        with:
          name: built-component-${{ matrix.component }}
          path: ${{ runner.temp }}/component-${{ matrix.component }}.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.publish }}
        with:
          name: e2e-image-${{ matrix.component }}
          path: ${{ runner.temp }}/openathlete-${{ matrix.component }}.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  images:
    name: Verify component source identities
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: component-source-plan
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: built-component-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - run: python scripts/components.py merge --plan "$RUNNER_TEMP/component-plan.json" --records "$RUNNER_TEMP/records" --output "$RUNNER_TEMP/candidate.json"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: ${{ runner.temp }}/candidate.json
          retention-days: 30
          if-no-files-found: error

  regression:
    name: Balanced full regression
    needs: images
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/e2e-shards.yml
    with:
      publish: ${{ inputs.publish }}

  candidate:
    name: Record tested production candidate
    needs: regression
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: e2e-verification
          path: ${{ runner.temp }}/verified
      - run: python scripts/release.py candidate --input "$RUNNER_TEMP/verified/candidate.json" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: tourmalet-candidate
          path: ${{ runner.temp }}/verified/candidate.json
          retention-days: 30
          if-no-files-found: error
