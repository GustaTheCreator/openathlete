# Builds the images from this repository instead of pulling them:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  migrator:
    image: openathlete-migrator:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://openathlete:${POSTGRES_PASSWORD:-openathlete_dev_password}@postgres:5432/openathlete
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openathlete-network

  api:
    image: openathlete-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      SKIP_MIGRATIONS: 'true'
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    image: openathlete-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      SOURCE_CODE_URL: "${SOURCE_CODE_URL:-https://github.com/GustaTheCreator/openathlete/tree/tourmalet}"
