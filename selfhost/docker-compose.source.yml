services:
  api:
    image: openathlete-api:tourmalet-2026.11.16
    pull_policy: never
    build:
      context: .
      dockerfile: apps/api/Dockerfile
  web:
    image: openathlete-web:tourmalet-2026.11.16
    pull_policy: never
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      - type: bind
        source: ./public-privacy
        target: /usr/share/nginx/html/privacidade
        read_only: true
        bind:
          create_host_path: false
